# =============================================================================
# starship.toml - Starship Prompt Config (DevSecOps)
# =============================================================================
# Docs: https://starship.rs/config/
# Instalar: cargo install starship --locked
# Ativar: eval "$(starship init zsh)"
# =============================================================================

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$python\
$nodejs\
$golang\
$rust\
$docker_context\
$terraform\
$env_var\
$cmd_duration\
$line_break\
$character"""

# ============================================
# OS ICON
# ============================================
[os]
disabled = false
style = "bg:#89b4fa fg:#1e1e2e"

[os.symbols]
Linux = ""
Arch = ""
Ubuntu = ""
Debian = ""
Fedora = ""
CentOS = ""
Manjaro = ""
WSL = ""

# ============================================
# USERNAME
# ============================================
[username]
show_always = false
style_user = "bg:#f38ba8 fg:#1e1e2e"
style_root = "bg:#f38ba8 fg:#fab387"
format = '[ $user ]($style)'

# ============================================
# HOSTNAME
# ============================================
[hostname]
ssh_only = true
style = "bg:#f9e2af fg:#1e1e2e"
format = '[ $hostname ]($style)'

# ============================================
# DIRECTORY
# ============================================
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bg:#a6e3a1 fg:#1e1e2e"
format = '[ $path ]($style)'
read_only = " 🔒"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = " "
"Dev" = " "

# ============================================
# GIT
# ============================================
[git_branch]
symbol = " "
style = "bg:#cba6f7 fg:#1e1e2e"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#f5c2e7 fg:#1e1e2e"
format = '[$all_status$ahead_behind ]($style)'

[git_metrics]
only_nonzero = true
added_style = "fg:#a6e3a1"
deleted_style = "fg:#f38ba8"
format = '[+$added ]($added_style)[-$deleted ]($deleted_style)'

# ============================================
# LANGUAGE-SPECIFIC
# ============================================
[python]
symbol = " "
style = "bg:#f9e2af fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'
detect_files = ["pyproject.toml", "setup.py", "requirements.txt", ".python-version"]

[nodejs]
symbol = " "
style = "bg:#94e2d5 fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'
detect_files = ["package.json", ".node-version", ".nvmrc"]

[golang]
symbol = " "
style = "bg:#89dceb fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'
detect_files = ["go.mod", "go.sum"]

[rust]
symbol = "🦀"
style = "bg:#fab387 fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'
detect_files = ["Cargo.toml", "Cargo.lock"]

# ============================================
# DOCKER
# ============================================
[docker_context]
symbol = " "
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol $context ]($style)'
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ============================================
# TERRAFORM / IaC
# ============================================
[terraform]
symbol = " "
style = "bg:#cba6f7 fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

# ============================================
# ENVIRONMENT VARIABLES
# ============================================
[env_var]
variable = "VIRTUAL_ENV"
symbol = " "
style = "bg:#a6e3a1 fg:#1e1e2e"
format = '[ $symbol $env_value ]($style)'

# ============================================
# COMMAND DURATION
# ============================================
[cmd_duration]
min_time = 2000
format = '[  $duration ]($style)'

# ============================================
# CHARACTER (prompt arrow)
# ============================================
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

# ============================================
# PALETTE (Catppuccin Mocha)
# ============================================
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
